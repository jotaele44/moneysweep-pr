# Activation matrix — which skill (or route) a prompt should select.
#
# Consumed by scripts/validate_skills.py (activation-tests job) and
# tests/skill_contract/. Each case names the expected route:
#   - a skill_id in the registry, OR
#   - "route_to_hub" (cross-producer correlation → thehub-pr), OR
#   - "route_to_centinelas" (signal collection → centinelas-pr), OR
#   - "clarify" (ambiguous; operator must ask before routing).
# every_expected_skill must exist in skill-registry.yaml (validator-enforced).

schema_version: prii_activation_matrix_v1

positive:
  - prompt: "run strict preflight before the pipeline"
    expect: moneysweep-run-preflight
  - prompt: "which sources are due for a refresh this week"
    expect: moneysweep-plan-source-updates
  - prompt: "why does coverage read 4% and what is the real denominator"
    expect: moneysweep-recover-source-coverage
  - prompt: "I dropped the Donaciones CSV, ingest it"
    expect: moneysweep-ingest-manual-source
  - prompt: "which financial domains and periods are still missing"
    expect: moneysweep-audit-financial-gaps
  - prompt: "is this vendor the same entity as its parent company"
    expect: moneysweep-resolve-entities
  - prompt: "show BPOP institutional ownership for the certified eight quarters"
    expect: moneysweep-ownership-capital
  - prompt: "this Centinelas signal now has an official contract record"
    expect: moneysweep-process-centinelas-handoff
  - prompt: "build the canonical export package in test mode"
    expect: moneysweep-build-federation-export
  - prompt: "can we promote usaspending_prime to production"
    expect: moneysweep-assess-promotion-readiness
  - prompt: "certify the final MoneySweep public-finance release after rendered federation production and native checks"
    expect: moneysweep-certify-public-finance-release
  - prompt: "does our export manifest still match the Hub contract"
    expect: prii-check-producer-contract
  - prompt: "what is MoneySweep's current status and next command"
    expect: moneysweep-operator

negative:
  - prompt: "correlate spending across MoneySweep, Centinelas, and the Hub"
    expect: route_to_hub
    reason: "cross-producer correlation is Hub-owned"
  - prompt: "collect new Centinelas signals from the source feeds"
    expect: route_to_centinelas
    reason: "Centinelas signal collection is centinelas-pr-owned (not the Hub)"
  - prompt: "show me the producer dashboard as the product UI"
    expect: clarify
    reason: "producer dashboard is diagnostic-only; Hub frontend is the product"

ambiguous:
  - prompt: "fix the sources"
    expect: clarify
    reason: "target unclear — plan/refresh, recover coverage, or ingest a drop"
  - prompt: "make it complete"
    expect: clarify
    reason: "which corpus, and complete against which denominator"
