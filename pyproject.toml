[tool.mypy]
# Gradually-typed baseline. As of Wave D (docs/BUILD_EXECUTION_SEQUENCE.md) the
# moneysweep/ package type-checks clean and .github/workflows/mypy.yml is a
# GATING check. As of sequence task 24, scripts/ is also in scope and clean.
# Remaining widening (future work): bring run_all.py into scope and drop
# ignore_missing_imports per-module as third-party stubs land.
#
# The federation local-workspace baseline is Python 3.11. Keep this value,
# .python-version, the gating workflows, SETUP.md, and requirements.lock
# generation provenance synchronized.
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# follow_imports=silent type-checks only the listed packages; modules reached by
# import outside them (e.g. tests/, archive/) are followed for symbols but their
# own errors are not reported.
follow_imports = "silent"
# server/, shared/, readiness/ and desktop/ joined the checked scope in the
# 2026-09 gap analysis. server/ and server/backend/ carry no __init__.py and are
# implicit namespace packages, so server/backend/case_manager_app.py's
# `from . import case_manager_api` only resolves for mypy with the two settings
# below. Adding __init__.py files instead would work for mypy but would inject a
# new python_module candidate into the GUI-parity inventory --
# scripts/check_gui_parity.py rglobs every .py under discovery.backend_roots --
# and AGENTS.md forbids regenerating gui-parity-baseline.json to clear a gate.
namespace_packages = true
explicit_package_bases = true
# moneysweep/ (package) + scripts/ (CLI/pipeline) are both checked and clean.
# run_all_legacy.py (2073 LOC) remains out of scope; decomposing it is tracked
# separately in docs/GAP_ANALYSIS_AND_OPTIMIZATION_2026-09.md (finding B4).
files = ["moneysweep", "scripts", "server", "shared", "readiness", "desktop"]
exclude = "(^archive/|tests/)"

[tool.ruff]
# Lint is GATING: .github/workflows/lint.yml runs `ruff check .` and
# `ruff format --check .` with no continue-on-error (see Makefile's
# `lint`/`format-check` targets, which mirror it exactly). This comment used
# to describe that as a future "Wave B, task 13" flip from a non-gating
# start; that flip has already happened. Keep the rule set here aligned with
# ruff's defaults so the measured baseline stays stable.
line-length = 100
target-version = "py311"
extend-exclude = ["archive"]

[tool.ruff.lint]
# ruff defaults: E4/E7/E9 (a safe pycodestyle subset) + F (pyflakes). Broader rule
# families (I, UP, B, …) are enabled later in the sequence once the tree is clean.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# E402 (import-not-at-top) is intentional in these files: each inserts the repo
# root into sys.path before importing first-party modules, or (in the test files)
# deliberately interleaves per-source imports between test groups for locality.
# Reordering would break the sys.path bootstrap, so the rule is suppressed here
# rather than "fixed".
"run_all.py" = ["E402"]
"run_all_legacy.py" = ["E402"]
"scripts/run_export.py" = ["E402"]
"scripts/smoke_export.py" = ["E402"]
"scripts/build_export_streams.py" = ["E402"]
"tests/test_new_downloaders.py" = ["E402"]
"tests/test_ingest_manual_data.py" = ["E402"]
