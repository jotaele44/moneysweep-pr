name: Restore frozen SEC certification snapshot
description: >
  Download the frozen SEC 13F certification snapshot, verify the archive's
  pinned SHA-256, and unpack it into the workspace. The durable copy is a
  release asset; the original Actions artifact (90-day retention) is only a
  fallback. Either way the bytes must match the pinned digest, so the source
  of the download never changes what is certified.

inputs:
  token:
    description: Token with actions:read and contents:read on this repository.
    required: true
  artifact-id:
    description: Actions artifact ID of the original frozen snapshot.
    required: false
    default: "9598537414"
  release-tag:
    description: Release that holds the durable copy of the snapshot archive.
    required: false
    default: "evidence-sec13f-bpop-8q-v1"
  asset-name:
    description: Asset file name inside that release.
    required: false
    default: "sec-ownership-bpop-8q-audit.zip"
  archive-sha256:
    description: Pinned SHA-256 of the snapshot archive.
    required: false
    default: "b815af1baf1d80e4230ce5aa2a0fae98dfcdf9ec850ca2d05fa7dc8eaadb9fa6"

runs:
  using: composite
  steps:
    - name: Download, verify and unpack the snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SNAPSHOT_ARTIFACT_ID: ${{ inputs.artifact-id }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        ASSET_NAME: ${{ inputs.asset-name }}
        ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
      run: |
        set -euo pipefail
        workdir="$RUNNER_TEMP/sec-snapshot"
        rm -rf "$workdir"
        mkdir -p "$workdir"
        archive="$workdir/$ASSET_NAME"

        if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern "$ASSET_NAME" --dir "$workdir"; then
          echo "Snapshot source: release $RELEASE_TAG"
        else
          echo "::warning::Release $RELEASE_TAG has no $ASSET_NAME; falling back to Actions artifact $SNAPSHOT_ARTIFACT_ID, which expires. Run the 'SEC Ownership Snapshot Preserve' workflow."
          rm -f "$archive"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$archive" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SNAPSHOT_ARTIFACT_ID/zip"
          echo "Snapshot source: Actions artifact $SNAPSHOT_ARTIFACT_ID"
        fi

        printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
        unzip -q "$archive" -d "$GITHUB_WORKSPACE"
