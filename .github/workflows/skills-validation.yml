name: Skills Validation

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "skill-registry.yaml"
      - "activation-matrix.yaml"
      - "dependency-graph.yaml"
      - "federation.json"
      - "schemas/**"
      - "scripts/validate_skills.py"
      - "tests/skill_contract/**"
      - ".github/workflows/skills-validation.yml"
  pull_request:
    paths:
      - "skills/**"
      - "skill-registry.yaml"
      - "activation-matrix.yaml"
      - "dependency-graph.yaml"
      - "federation.json"
      - "schemas/**"
      - "scripts/validate_skills.py"
      - "tests/skill_contract/**"
      - ".github/workflows/skills-validation.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skill-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Validate dependency profiles
        run: python3 scripts/validate_dependency_planes.py
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Validate skill packet
        run: python3 scripts/validate_skills.py
      - name: Skill-contract test fixtures
        run: python3 -m pytest tests/skill_contract/ -q -p no:cacheprovider --no-cov
