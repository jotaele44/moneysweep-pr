name: Production certification audit

on:
  pull_request:
    paths:
      - "registries/production_certification.yaml"
      - "schemas/operator_evidence_receipt.schema.json"
      - "schemas/source_equivalence_claim.schema.json"
      - "tools/certify_production.py"
      - "tools/certify_production_scope_bound.py"
      - "tools/certification_operator_lineage.py"
      - "tools/verify_source_equivalence.py"
      - "tools/audit_materialization_coverage.py"
      - "tools/audit_entity_resolution_certification.py"
      - "tools/operator_corpus_common.py"
      - "tools/build_operator_corpus.py"
      - "tools/verify_operator_corpus.py"
      - "tools/write_operator_evidence_receipt.py"
      - "tools/derive_certification_truth.py"
      - "tools/derive_certification_truth_scope_bound.py"
      - "tools/build_certification_blocker_graph.py"
      - "tests/test_production_certification.py"
      - "tests/test_operator_corpus.py"
      - "tests/test_certification_operator_lineage.py"
      - "tests/test_certify_production_scope_bound.py"
      - "tests/test_source_equivalence.py"
      - "tests/test_certification_truth.py"
      - "tests/test_derive_certification_truth_scope_bound.py"
      - "tests/test_certification_blocker_graph.py"
      - "reports/**"
      - "registries/**"
      - "scripts/**"
      - "moneysweep/**"
      - "federation.json"
      - ".github/workflows/production-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CERT_SCOPE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      CERT_IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout audit implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERT_IMPLEMENTATION_SHA }}
          path: implementation
          fetch-depth: 0

      - name: Checkout frozen certification scope
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERT_SCOPE_SHA }}
          path: scope
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r implementation/requirements.txt

      - name: Run certification regression tests
        working-directory: implementation
        run: |
          python -m pytest \
            tests/test_production_certification.py \
            tests/test_operator_corpus.py \
            tests/test_certification_operator_lineage.py \
            tests/test_certify_production_scope_bound.py \
            tests/test_source_equivalence.py \
            tests/test_certification_truth.py \
            tests/test_derive_certification_truth_scope_bound.py \
            tests/test_certification_blocker_graph.py \
            -q -o addopts=""

      - name: Derive immutable current truth scope
        working-directory: implementation
        run: |
          python -m tools.derive_certification_truth_scope_bound \
            --root ../scope \
            --evidence-root ../scope \
            --scope-dir build/certification-scope-ci \
            --as-of "${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp || '2026-09-16T00:00:00Z' }}"

      - name: Verify scope binding before certification
        working-directory: implementation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("build/certification-scope-ci/scope_manifest.json").read_text(encoding="utf-8")
          )
          binding = manifest.get("scope_binding", {})
          identity = manifest.get("scope_identity", {})
          scope_sha = os.environ["CERT_SCOPE_SHA"]
          implementation_sha = os.environ["CERT_IMPLEMENTATION_SHA"]
          checks = {
              "scope_sha": binding.get("scope_repository_sha") == scope_sha,
              "evidence_sha": binding.get("evidence_repository_sha") == scope_sha,
              "same_repository": binding.get("evidence_repository_same_as_scope") is True,
              "path_not_identity": binding.get("path_strings_are_identity") is False,
              "identity_scope_sha": identity.get("scope_repository_sha") == scope_sha,
              "identity_evidence_sha": identity.get("evidence_repository_sha") == scope_sha,
              "implementation_sha": identity.get("implementation_sha") == implementation_sha,
          }
          failed = [name for name, ok in checks.items() if not ok]
          print(json.dumps({"checks": checks, "scope_id": manifest.get("scope_id")}, indent=2, sort_keys=True))
          if failed:
              raise SystemExit("Scope binding checks failed: " + ", ".join(failed))
          PY

      - name: Regenerate current-denominator lineage evidence
        working-directory: implementation
        run: |
          python tools/audit_materialization_coverage.py \
            --root ../scope \
            --output ../scope/reports/materialization_coverage_audit.json
          cp ../scope/reports/materialization_coverage_audit.json \
            reports/materialization_coverage_audit.ci.json

      - name: Audit G7 relationship dependencies
        working-directory: implementation
        run: |
          set +e
          python tools/audit_entity_resolution_certification.py \
            --root ../scope \
            --output ../implementation/reports/entity_resolution_certification_audit.ci.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi

      - name: Execute exhaustive certification audit
        working-directory: implementation
        run: |
          # Truth scope is supplied and identity-bound. No operator corpus is supplied
          # in ordinary PR CI, so G8 must remain fail-closed/non-authoritative.
          python -m tools.certify_production_scope_bound \
            --root ../scope \
            --config registries/production_certification.yaml \
            --truth-root build/certification-scope-ci \
            --scope-sha "$CERT_SCOPE_SHA" \
            --implementation-sha "$CERT_IMPLEMENTATION_SHA" \
            --run-preflight \
            --output reports/production_certification.ci.json

      - name: Build exact blocker DAG from frozen truth
        working-directory: implementation
        run: |
          python -m tools.build_certification_blocker_graph \
            --certificate reports/production_certification.ci.json \
            --scope-root build/certification-scope-ci \
            --output reports/certification_blocker_graph.ci.json

      - name: Verify fail-closed result is internally consistent
        working-directory: implementation
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          report = json.loads(
              Path("reports/production_certification.ci.json").read_text(encoding="utf-8")
          )
          lineage = json.loads(
              Path("reports/materialization_coverage_audit.ci.json").read_text(encoding="utf-8")
          )
          g7 = json.loads(
              Path("reports/entity_resolution_certification_audit.ci.json").read_text(encoding="utf-8")
          )
          truth_scope = json.loads(
              Path("build/certification-scope-ci/scope_manifest.json").read_text(encoding="utf-8")
          )
          blocker_graph = json.loads(
              Path("reports/certification_blocker_graph.ci.json").read_text(encoding="utf-8")
          )
          current_digest = (
              "4c551385f00ca6df4332ee1643d0ef7a6ab85172632d945d35be285cd94f5826"
          )
          gates = {gate["id"]: gate for gate in report["gates"]}
          checks = {
              "source_ledger_164": len(report["source_universe"]["source_ledger"]) == 164,
              "lineage_denominator_164": lineage["local_truth_summary"]["total_sources"] == 164,
              "lineage_registry_digest_current": lineage["audit_scope"]["registry_source_ids_sha256"] == current_digest,
              "ci_lineage_not_operator_authoritative": lineage["audit_scope"]["operator_corpus_authoritative"] is False,
              "ci_lineage_proof_absent": "operator_corpus_proof_not_supplied" in lineage["audit_scope"]["authority_blockers"],
              "ci_lineage_orphans_fail_closed": lineage["processed_file_inventory"]["orphan_rows"] is None,
              "truth_scope_registry_digest_current": truth_scope["scope_identity"]["registry_source_ids_sha256"] == current_digest,
              "truth_scope_id_bound": report["scope"]["truth_scope_id"] == truth_scope["scope_id"],
              "g8_bridge_not_operator_authoritative": gates["G8_PROVENANCE_AND_LINEAGE"]["evidence"]["operator_corpus_authoritative"] is False,
              "g8_bridge_requires_corpus": "operator_corpus_root_not_supplied" in gates["G8_PROVENANCE_AND_LINEAGE"]["blockers"],
              "g8_truth_scope_supplied": "truth_scope_required_for_operator_corpus" not in gates["G8_PROVENANCE_AND_LINEAGE"]["blockers"],
              "g7_policy_no_name_only_resolution": g7["policy"]["name_only_resolution_allowed"] is False,
              "g7_policy_no_threshold_lowering": g7["policy"]["confidence_threshold_lowered"] is False,
              "scope_sha_bound_to_checkout": report["scope"]["commit_sha"] == report["scope"]["checkout_head_sha"],
              "scope_sha_valid": bool(re.fullmatch(r"[0-9a-f]{40}", report["scope"]["commit_sha"])),
              "implementation_sha_valid": bool(re.fullmatch(r"[0-9a-f]{40}", report["audit_implementation"]["commit_sha"])),
              "blocker_graph_same_scope": blocker_graph.get("scope", {}).get("truth_scope_id") == report["scope"].get("truth_scope_id"),
              "eligibility_matches_state": report["production_eligible"] == (report["certification_state"] == "CERTIFIED"),
              "nonpass_ledger_consistent": (report["nonpass_gate_ids"] == []) if report["production_eligible"] else bool(report["nonpass_gate_ids"]),
          }
          failed = [name for name, ok in checks.items() if not ok]
          print(json.dumps({"checks": checks, "g7_candidate_state": g7["g7_candidate_state"], "failed": failed}, indent=2, sort_keys=True))
          if failed:
              raise SystemExit("Certification consistency checks failed: " + ", ".join(failed))
          PY

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-certification-audit
          path: |
            implementation/reports/production_certification.ci.json
            implementation/reports/materialization_coverage_audit.ci.json
            implementation/reports/entity_resolution_certification_audit.ci.json
            implementation/reports/certification_blocker_graph.ci.json
            implementation/build/certification-scope-ci/
          if-no-files-found: error
