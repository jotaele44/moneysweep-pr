name: Production certification audit

on:
  pull_request:
    paths:
      - "registries/production_certification.yaml"
      - "schemas/operator_evidence_receipt.schema.json"
      - "schemas/source_equivalence_claim.schema.json"
      - "tools/certify_production.py"
      - "tools/audit_materialization_coverage.py"
      - "tools/audit_entity_resolution_certification.py"
      - "tools/operator_corpus_common.py"
      - "tools/build_operator_corpus.py"
      - "tools/verify_operator_corpus.py"
      - "tools/derive_certification_truth.py"
      - "tools/verify_source_equivalence.py"
      - "tools/assemble_keyless_operator_workspace.py"
      - "tools/write_operator_evidence_receipt.py"
      - "tests/test_certification_truth.py"
      - "tests/test_keyless_operator_workspace.py"
      - "tests/test_operator_corpus.py"
      - "tests/test_source_equivalence.py"
      - "reports/**"
      - "registries/**"
      - "scripts/**"
      - "moneysweep/**"
      - "federation.json"
      - ".github/workflows/production-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CERT_SCOPE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      CERT_IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout audit implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERT_IMPLEMENTATION_SHA }}
          path: implementation
          fetch-depth: 0

      - name: Checkout frozen certification scope
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CERT_SCOPE_SHA }}
          path: scope
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: implementation/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r implementation/requirements.txt

      - name: Run trust-root regression tests
        working-directory: implementation
        run: |
          python -m pytest \
            tests/test_certification_truth.py \
            tests/test_keyless_operator_workspace.py \
            tests/test_operator_corpus.py \
            tests/test_source_equivalence.py \
            -q -o addopts=""

      - name: Derive usable-output certification truth
        working-directory: implementation
        run: |
          rm -rf ../derived-certification-scope
          python tools/derive_certification_truth.py \
            --root ../scope \
            --evidence-root ../scope \
            --scope-dir ../derived-certification-scope
          cp ../derived-certification-scope/reports/source_registry_status.csv \
            ../scope/reports/source_registry_status.csv
          cp ../derived-certification-scope/reports/materialization_readiness.json \
            ../scope/reports/materialization_readiness.json
          cp ../derived-certification-scope/reports/completeness_matrix.json \
            ../scope/reports/completeness_matrix.json
          cp ../derived-certification-scope/reports/source_freshness.csv \
            ../scope/reports/source_freshness.csv
          cp ../derived-certification-scope/reports/certification_truth.json \
            reports/certification_truth.ci.json
          cp ../derived-certification-scope/scope_manifest.json \
            reports/certification_scope_manifest.ci.json

      - name: Regenerate current-denominator lineage evidence
        working-directory: implementation
        run: |
          python tools/audit_materialization_coverage.py \
            --root ../scope \
            --output ../scope/reports/materialization_coverage_audit.json
          cp ../scope/reports/materialization_coverage_audit.json \
            reports/materialization_coverage_audit.ci.json

      - name: Audit G7 relationship dependencies
        working-directory: implementation
        run: |
          set +e
          python tools/audit_entity_resolution_certification.py \
            --root ../scope \
            --output ../implementation/reports/entity_resolution_certification_audit.ci.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi

      - name: Execute exhaustive diagnostic certification audit
        working-directory: implementation
        run: |
          python -m tools.certify_production \
            --root ../scope \
            --config registries/production_certification.yaml \
            --scope-sha "$CERT_SCOPE_SHA" \
            --implementation-sha "$CERT_IMPLEMENTATION_SHA" \
            --run-preflight \
            --output reports/production_certification.ci.json

      - name: Verify live-denominator fail-closed consistency
        working-directory: implementation
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          report = json.loads(Path("reports/production_certification.ci.json").read_text())
          lineage = json.loads(Path("reports/materialization_coverage_audit.ci.json").read_text())
          readiness = json.loads(Path("../scope/reports/materialization_readiness.json").read_text())
          truth = json.loads(Path("reports/certification_truth.ci.json").read_text())
          scope_manifest = json.loads(Path("reports/certification_scope_manifest.ci.json").read_text())
          g7 = json.loads(Path("reports/entity_resolution_certification_audit.ci.json").read_text())

          with Path("../scope/reports/source_registry_status.csv").open(encoding="utf-8-sig", newline="") as fh:
              status_rows = list(csv.DictReader(fh))
          required_rows = [row for row in status_rows if row.get("required", "").lower() == "true"]
          cor3 = next((row for row in status_rows if row["source_id"] == "cor3"), None)

          total = readiness["total_sources"]
          digest = readiness["source_count_provenance"]["source_ids_sha256"]
          checks = {
              "source_ledger_matches_live_total": len(report["source_universe"]["source_ledger"]) == total,
              "truth_matches_live_total": truth["registry"]["total_sources"] == total,
              "required_count_matches_truth": len(required_rows) == truth["registry"]["required_sources"],
              "lineage_denominator_matches_live_total": lineage["local_truth_summary"]["total_sources"] == total,
              "lineage_registry_digest_matches_live": lineage["audit_scope"]["registry_source_ids_sha256"] == digest,
              "report_registry_digest_matches_live": report["scope"]["registry_source_ids_sha256"] == digest,
              "scope_manifest_digest_matches_live": scope_manifest["scope_identity"]["registry_source_ids_sha256"] == digest,
              "ci_lineage_not_operator_authoritative": lineage["audit_scope"]["operator_corpus_authoritative"] is False,
              "ci_lineage_orphans_fail_closed": lineage["processed_file_inventory"]["orphan_rows"] is None,
              "g7_no_name_only_resolution": g7["policy"]["name_only_resolution_allowed"] is False,
              "g7_no_threshold_lowering": g7["policy"]["confidence_threshold_lowered"] is False,
              "scope_sha_valid": bool(re.fullmatch(r"[0-9a-f]{40}", report["scope"]["commit_sha"])),
              "implementation_sha_valid": bool(re.fullmatch(r"[0-9a-f]{40}", report["audit_implementation"]["commit_sha"])),
              "eligibility_matches_state": report["production_eligible"] == (report["certification_state"] == "CERTIFIED"),
              "diagnostic_ci_not_activation": report["production_eligible"] is False,
              "zero_row_cor3_not_full": cor3 is None or cor3["pipeline_status"] != "fully_materialized",
          }
          failed = [name for name, ok in checks.items() if not ok]
          print(json.dumps({
              "live_total": total,
              "required_total": len(required_rows),
              "digest": digest,
              "scope_id": scope_manifest["scope_id"],
              "checks": checks,
              "failed": failed,
          }, indent=2, sort_keys=True))
          if failed:
              raise SystemExit("Certification consistency checks failed: " + ", ".join(failed))
          PY

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-certification-audit
          path: |
            implementation/reports/production_certification.ci.json
            implementation/reports/certification_truth.ci.json
            implementation/reports/certification_scope_manifest.ci.json
            implementation/reports/materialization_coverage_audit.ci.json
            implementation/reports/entity_resolution_certification_audit.ci.json
          if-no-files-found: error
