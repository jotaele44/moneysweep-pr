name: MoneySweep directory-output regression

on:
  push:
    branches: [chatgpt/moneysweep-directory-output-fix-20260928]
    paths:
      - moneysweep/update_controller/validation.py
      - tests/test_source_update_validation.py
      - .github/workflows/directory-output-regression.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_source_update_validation.py tests/test_source_update_cli.py
