name: MAX certification one-shot formatter

on:
  pull_request:
    paths:
      - ".github/workflows/max-certification-autoformat.yml"
      - "scripts/run_automatable_sources.py"
      - "tests/test_certification_truth.py"
      - "tests/test_operator_corpus.py"
      - "tests/test_operator_drop.py"
      - "tools/assemble_certification_evidence.py"
      - "tools/build_operator_corpus.py"
      - "tools/derive_certification_truth.py"
      - "tools/ingest_operator_drop.py"
      - "tools/operator_corpus_common.py"
      - "tools/run_certification_derivations.py"
      - "tools/run_certification_public_adapters.py"
      - "tools/verify_operator_corpus.py"
      - "tools/verify_source_equivalence.py"
      - "tools/write_operator_evidence_receipt.py"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff==0.14.14"
      - name: Format bounded certification files
        run: |
          ruff format \
            scripts/run_automatable_sources.py \
            tests/test_certification_truth.py \
            tests/test_operator_corpus.py \
            tests/test_operator_drop.py \
            tools/assemble_certification_evidence.py \
            tools/build_operator_corpus.py \
            tools/derive_certification_truth.py \
            tools/ingest_operator_drop.py \
            tools/operator_corpus_common.py \
            tools/run_certification_derivations.py \
            tools/run_certification_public_adapters.py \
            tools/verify_operator_corpus.py \
            tools/verify_source_equivalence.py \
            tools/write_operator_evidence_receipt.py
      - name: Commit formatter-only diff
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_automatable_sources.py \
            tests/test_certification_truth.py \
            tests/test_operator_corpus.py \
            tests/test_operator_drop.py \
            tools/assemble_certification_evidence.py \
            tools/build_operator_corpus.py \
            tools/derive_certification_truth.py \
            tools/ingest_operator_drop.py \
            tools/operator_corpus_common.py \
            tools/run_certification_derivations.py \
            tools/run_certification_public_adapters.py \
            tools/verify_operator_corpus.py \
            tools/verify_source_equivalence.py \
            tools/write_operator_evidence_receipt.py
          git commit -m "style: apply Ruff formatter to MAX certification files"
          git push origin HEAD:${{ github.head_ref }}
