name: Lockfile drift

# Gating: requirements.lock is compiled from requirements.in by uv. This re-runs
# the compile and fails if the committed lock is stale, so a dependency change to
# requirements.in can't merge without its lockfile update (and vice versa).
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"

      - name: Recompile the lockfile
        run: uv pip compile requirements.in --universal --python-version 3.11 -o requirements.lock

      - name: Upload regenerated lock candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-lock-python311
          path: requirements.lock
          if-no-files-found: error

      - name: Assert no drift
        run: |
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of date with requirements.in." \
              "Run: uv pip compile requirements.in --universal --python-version 3.11 -o requirements.lock"
            exit 1
          fi
