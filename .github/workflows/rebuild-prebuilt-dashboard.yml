name: Rebuild prebuilt dashboard
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-prebuilt-dashboard.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Rebuild committed prebuilt dashboard
        run: python3 scripts/build_prebuilt_dashboard.py --build
      - name: Verify bundle freshness
        run: python3 scripts/build_prebuilt_dashboard.py --check
      - name: Commit regenerated bundle to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- desktop/prebuilt-dashboard; then
            echo "No prebuilt dashboard changes."
            exit 0
          fi
          branch="automation/prebuilt-dashboard-activity-plane"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add desktop/prebuilt-dashboard
          git commit -m "Regenerate prebuilt dashboard for activity timeline"
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" --title "Regenerate prebuilt dashboard for activity timeline" --body "Regenerates the committed desktop prebuilt bundle after the PROGRAM_ACTIVITY_EVENT/v1 dashboard source changes. The workflow runs the canonical build and freshness check before opening this PR."
          fi
