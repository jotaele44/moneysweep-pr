name: MoneySweep recovery successor v3 — data layers
on:
  push:
    branches: [recovery/floot-baseline-2026-09-30]
    paths:
      - ".recovery/moneysweep-successor-v3/**"
      - ".github/workflows/recovery-moneysweep-successor-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  successor-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Reproduce exact 45-test baseline
        shell: bash
        run: bash .recovery/moneysweep-exact/run_exact.sh
      - name: Apply successor overlays v1-v3
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          echo "8fcfe41d3552f2f28026bb7b01c1b3500941c961c6db9254d32b46de3ed45c84  .recovery/moneysweep-successor-v1/overlay.tar.gz" | sha256sum -c -
          echo "97ee65c78ab6cf301a87636dedc7a73f00cedb477d3d28589ccfcbd621f16210  .recovery/moneysweep-successor-v2/overlay.tar.gz" | sha256sum -c -
          tar -xzf .recovery/moneysweep-successor-v1/overlay.tar.gz -C "$ROOT"
          tar -xzf .recovery/moneysweep-successor-v2/overlay.tar.gz -C "$ROOT"
          cp .recovery/moneysweep-successor-v3/moneySweepDataLayers.tsx "$ROOT/helpers/moneySweepDataLayers.tsx"
          cp .recovery/moneysweep-successor-v3/moneySweepDataLayers.spec.tsx "$ROOT/helpers/moneySweepDataLayers.spec.tsx"
          cp .recovery/moneysweep-successor-v3/moneySweepAccessDbParity.spec.tsx "$ROOT/helpers/moneySweepAccessDbParity.spec.tsx"
          cd "$ROOT"
          sha256sum helpers/moneySweepIdentity.tsx helpers/moneySweepIdentity.spec.tsx helpers/moneySweepSourceCoverage.tsx helpers/moneySweepSourceCoverage.spec.tsx helpers/moneySweepDataLayers.tsx helpers/moneySweepDataLayers.spec.tsx helpers/moneySweepAccessDbParity.spec.tsx > successor-v3-overlay-hashes.txt
      - name: Execute successor v3 regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          mapfile -t exec_specs < <(awk -F '\t' '$2=="EXECUTABLE"{print $1}' recovery-spec-classification.tsv)
          exec_specs+=(helpers/moneySweepIdentity.spec.tsx helpers/moneySweepSourceCoverage.spec.tsx helpers/moneySweepDataLayers.spec.tsx helpers/moneySweepAccessDbParity.spec.tsx)
          set +e
          npx vitest run --config recovery.vitest.config.mts --reporter=verbose "${exec_specs[@]}" 2>&1 | tee successor-v3-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v3-test-exit.txt
          test "$status" = "0"
          grep -q "20 passed" successor-v3-vitest.log
          grep -q "90 passed" successor-v3-vitest.log
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          set +e
          npx vite build 2>&1 | tee successor-v3-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v3-build-exit.txt
          test "$status" = "0"
      - name: Rendered desktop and mobile QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          npm install --save-dev --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/.recovery/moneysweep-successor-v3/rendered-qa.mjs" rendered-qa.mjs
          npx vite preview --host 127.0.0.1 --port 4173 > rendered-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node rendered-qa.mjs | tee rendered-qa.log
          kill "$preview_pid" 2>/dev/null || true
          trap - EXIT
          sha256sum rendered-qa.json rendered-desktop-1440.png rendered-iphone-393.png rendered-iphone-430.png > rendered-qa-hashes.txt
      - name: Freeze successor v3 receipt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/recovered"
          {
            echo "schema=moneysweep-recovery-successor/v3"
            echo "baseline_tests=45"
            echo "successor_v2_tests=75"
            echo "successor_v3_tests=90"
            echo "write_auth_acl=NOT_APPLICABLE_READ_ONLY_SURFACE"
            echo "db_schema_tables=5"
            echo "data_layers=RAW_NORMALIZED_CANONICAL_SEPARATE"
            echo "name_only_identity=DENY"
            echo "stable_identity=UEI_CAGE_EXPLICIT_BINDING_ONLY"
            echo "row_arithmetic=SOURCE_EQUALS_ADMITTED_PLUS_EXCLUDED_PLUS_UNRESOLVED"
            echo "source_provenance=REQUIRED"\n            echo "rendered_qa=DESKTOP_1440_IPHONE_393_IPHONE_430_PASS"
            echo "state=PASS"
          } > successor-v3-receipt.txt
          sha256sum package-lock.json successor-v3-overlay-hashes.txt successor-v3-vitest.log successor-v3-build.log rendered-qa.json rendered-qa-hashes.txt successor-v3-receipt.txt > successor-v3-evidence-hashes.txt
      - name: Upload successor v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneysweep-recovery-successor-v3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/successor-v3-overlay-hashes.txt
            ${{ runner.temp }}/recovered/successor-v3-vitest.log
            ${{ runner.temp }}/recovered/successor-v3-test-exit.txt
            ${{ runner.temp }}/recovered/successor-v3-build.log
            ${{ runner.temp }}/recovered/successor-v3-build-exit.txt
            ${{ runner.temp }}/recovered/successor-v3-receipt.txt
            ${{ runner.temp }}/recovered/successor-v3-evidence-hashes.txt
