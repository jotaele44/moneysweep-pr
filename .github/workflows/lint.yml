name: Lint

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"

      - name: Install dev tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Run ruff lint
        run: ruff check --output-format=github .

      - name: Run ruff format check
        shell: bash
        run: |
          # Production-v1 leaderboard runtime bytes are hash-bound into the
          # certified package and TheHub replay. Formatting them requires a new
          # certification/runtime/package/replay revision; lint still covers them.
          FROZEN_RE='^(scripts/(leaderboard_release_provenance|materialize_leaderboard_snapshot|certify_leaderboard_snapshot|materialize_leaderboard_git_snapshot|finalize_leaderboard_release|export_leaderboard_package)\.py|server/backend/(leaderboards|leaderboard_adapters|leaderboard_history|leaderboard_investigation|leaderboard_entities)\.py)$'
          mapfile -t files < <(git ls-files '*.py' | grep -Ev "$FROZEN_RE")
          ruff format --check "${files[@]}"
