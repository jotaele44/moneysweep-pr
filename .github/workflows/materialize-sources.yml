name: Materialize automatable sources

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight validates only; fetch permits source execution after exact confirmation"
        required: true
        type: choice
        options: [preflight, fetch]
        default: preflight
      confirm:
        description: "Live fetch only: type YES exactly"
        required: false
        default: ""
      source:
        description: "Optional single source id (blank = all automatable)"
        required: false
        default: ""
      family:
        description: "Optional family filter (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate fail-closed dispatch
        id: validate_dispatch
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          SOURCE: ${{ inputs.source }}
          FAMILY: ${{ inputs.family }}
        run: |
          set -euo pipefail
          python scripts/validate_live_fetch_dispatch.py \
            --workflow materialize-sources \
            --mode "$MODE" \
            --confirm "$CONFIRM" \
            --source "$SOURCE" \
            --family "$FAMILY"
          python -m py_compile \
            scripts/run_automatable_sources.py \
            scripts/run_automatable_sources_scoped.py
          if [[ "$MODE" == "fetch" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies for live fetch
        if: ${{ steps.validate_dispatch.outputs.authorized == 'true' }}
        run: pip install -r requirements.txt

      - name: Egress preflight for live fetch
        if: ${{ steps.validate_dispatch.outputs.authorized == 'true' }}
        run: python scripts/check_network_egress.py

      - name: Run automatable sources with source-scoped credentials
        if: ${{ steps.validate_dispatch.outputs.authorized == 'true' }}
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          FINANCIALDATA_API_KEY: ${{ secrets.FINANCIALDATA_API_KEY }}
          FINANCIALDATA_LICENSE_APPROVED: ${{ vars.FINANCIALDATA_LICENSE_APPROVED }}
          SOURCE: ${{ inputs.source }}
          FAMILY: ${{ inputs.family }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$SOURCE" ]]; then args+=(--source "$SOURCE"); fi
          if [[ -n "$FAMILY" ]]; then args+=(--family "$FAMILY"); fi
          python -m scripts.run_automatable_sources_scoped "${args[@]}"

      - name: Upload materialized outputs
        if: ${{ always() && steps.validate_dispatch.outputs.authorized == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: materialized-sources-${{ github.run_id }}
          path: |
            data/staging/processed
            data/staging/materialization_run_summary.json
          if-no-files-found: ignore

      - name: Write redacted dispatch receipt
        if: ${{ always() }}
        env:
          AUTHORIZED: ${{ steps.validate_dispatch.outputs.authorized }}
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          FAMILY: ${{ inputs.family }}
        run: |
          mkdir -p dispatch-receipt
          python - <<'PY'
          import json, os
          from pathlib import Path
          authorized = os.environ.get("AUTHORIZED") == "true"
          Path("dispatch-receipt/materialize-sources.json").write_text(
              json.dumps({
                  "schemaVersion": "1.0.0",
                  "workflow": "materialize-sources",
                  "mode": os.environ.get("MODE", "unknown"),
                  "authorized": authorized,
                  "liveFetchAuthorized": authorized,
                  "source": os.environ.get("SOURCE", ""),
                  "family": os.environ.get("FAMILY", ""),
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload dispatch receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: materialize-sources-dispatch-receipt-${{ github.run_id }}
          path: dispatch-receipt/materialize-sources.json
          if-no-files-found: error
