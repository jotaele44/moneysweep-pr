name: Unified Skillpack Conformance
on:
  pull_request:
    paths: ['.claude/skillpacks/**','tools/validate_unified_skillpacks.py','tests/test_unified_skillpack_conformance.py','.github/workflows/unified-skillpack-conformance.yml']
  push:
    branches: ['chore/unified-skillpacks-v1.0.0-*']
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Validate bundle and exact change scope
        shell: bash
        run: |
          args=(--root .)
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ -n "$PR_BASE_SHA" ]] || { echo "missing pull-request base SHA" >&2; exit 1; }
            args+=(--enforce-change-scope --change-base "$PR_BASE_SHA")
          fi
          python tools/validate_unified_skillpacks.py "${args[@]}"
      - run: python -m unittest discover -s tests -p 'test_unified_skillpack_conformance.py'
