name: PR assistance recovery format preview

on:
  pull_request:
    paths:
      - "scripts/recover_pr_assistance_failed_shards.py"
      - ".github/workflows/pr-assistance-format-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff format scripts/recover_pr_assistance_failed_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-recovery-script
          path: scripts/recover_pr_assistance_failed_shards.py
          retention-days: 1
