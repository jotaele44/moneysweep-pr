name: moneysweep-federation-design-pilot

on:
  pull_request:
    paths:
      - "dashboard/**"
      - "docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_*"
      - "docs/evidence/moneysweep-federation-design-pilot-v0-1/**"
      - ".github/workflows/moneysweep-federation-design-pilot.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verify-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/backend/requirements.txt
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Install application and backend runtime dependencies
        run: >-
          python -m pip install -r requirements.txt
          -r server/backend/requirements.txt
      - name: Verify package, unit contracts, lint and production build
        working-directory: dashboard
        run: npm run verify:pilot
      - name: Verify offline export build
        working-directory: dashboard
        run: npm run build:export
      - name: Install Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Run six-viewport accessibility and overflow matrix
        working-directory: dashboard
        env:
          PILOT_SCREENSHOT_DIR: ${{ runner.temp }}/moneysweep-pilot-evidence
          PILOT_REPORT_PATH: ${{ runner.temp }}/moneysweep-pilot-evidence/visual-check-report.json
        run: timeout --signal=TERM 420s npm run test:visual
      - name: Upload visual verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moneysweep-federation-design-pilot-evidence
          path: ${{ runner.temp }}/moneysweep-pilot-evidence
          if-no-files-found: error
          retention-days: 30
