name: Tests

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Validate dependency profiles
        run: python3 scripts/validate_dependency_planes.py
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt httpx jsonschema -r server/backend/requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Federation manifest gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("federation.json").read_text())
          required = {
              "schema_version", "program_id", "repository_full_name",
              "federation_role", "hub_parent", "hub_callable_commands",
              "canonical_outputs", "federation_readiness_gate",
          }
          missing = sorted(required - set(manifest))
          assert not missing, f"federation.json missing required keys: {missing}"
          assert manifest["schema_version"] == "repo_federation_manifest_v1"
          assert manifest["program_id"] == "moneysweep-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          commands = manifest["hub_callable_commands"]
          assert "setup" in commands and "runtime_setup" in commands and "test_suite" in commands
          gate = manifest["federation_readiness_gate"]
          assert isinstance(gate.get("ready_for_hub_discovery"), bool)
          assert isinstance(gate.get("ready_for_hub_live_execution"), bool)
          assert isinstance(gate.get("blocking_conditions"), list)
          print("federation manifest gate passed")
          PY
      - name: Run tests
        run: python -m pytest tests/ -v
