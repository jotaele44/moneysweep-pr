name: Contract Sweeper CI

on:
  pull_request:
  push:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile modules
        run: python -m compileall moneysweep scripts tests
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  guide-live-freeze:
    name: Guide bounded live freeze (one-shot branch gate)
    if: ${{ (github.event_name == 'push' && github.ref_name == 'audit/guide-financial-avenue-coverage-v1') || (github.event_name == 'pull_request' && github.head_ref == 'audit/guide-financial-avenue-coverage-v1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/guide-financial-avenue-coverage-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Retry-aware preflight
        id: preflight
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path('reports/guide_financial_live_freeze_attempt_v1.json')
          retry = {'ocif': True, 'ocs': True, 'ftz': True}
          if path.exists():
              exits = json.loads(path.read_text(encoding='utf-8')).get('exit_codes', {})
              retry = {k: int(exits.get(k, 999)) != 0 for k in retry}
          for key, value in retry.items():
              print(f"retry_{key}={'true' if value else 'false'}")
          print(f"needed={'true' if any(retry.values()) else 'false'}")
          PY
      - name: Materialize authoritative surfaces requiring retry
        if: ${{ steps.preflight.outputs.needed == 'true' }}
        id: materialize
        continue-on-error: true
        env:
          GUIDE_SOURCE_SNAPSHOT_DIR: data/raw/guide_financial_avenue_snapshots
          RETRY_OCIF: ${{ steps.preflight.outputs.retry_ocif }}
          RETRY_OCS: ${{ steps.preflight.outputs.retry_ocs }}
          RETRY_FTZ: ${{ steps.preflight.outputs.retry_ftz }}
        shell: bash
        run: |
          mkdir -p reports/guide_live_freeze_logs
          ocif=0; ocs=0; ftz=0
          set +e
          if [[ "$RETRY_OCIF" == "true" ]]; then python scripts/scrape_ocif_guide_financial_classes.py --force > reports/guide_live_freeze_logs/ocif.log 2>&1; ocif=$?; fi
          if [[ "$RETRY_OCS" == "true" ]]; then python scripts/scrape_ocs_insurers.py --force > reports/guide_live_freeze_logs/ocs.log 2>&1; ocs=$?; fi
          if [[ "$RETRY_FTZ" == "true" ]]; then python scripts/scrape_ftz_board_pr.py --force > reports/guide_live_freeze_logs/ftz.log 2>&1; ftz=$?; fi
          set -e
          echo "ocif_exit=$ocif" >> "$GITHUB_OUTPUT"
          echo "ocs_exit=$ocs" >> "$GITHUB_OUTPUT"
          echo "ftz_exit=$ftz" >> "$GITHUB_OUTPUT"
      - name: Validate frozen manifestations and regenerate audit
        if: ${{ steps.preflight.outputs.needed == 'true' }}
        id: finalize
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/finalize_guide_financial_freeze.py --snapshot-dir data/raw/guide_financial_avenue_snapshots > reports/guide_live_freeze_logs/finalize.log 2>&1
          rc=$?
          set -e
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
      - name: Freeze retry execution receipt
        if: ${{ steps.preflight.outputs.needed == 'true' }}
        env:
          OCIF_EXIT: ${{ steps.materialize.outputs.ocif_exit }}
          OCS_EXIT: ${{ steps.materialize.outputs.ocs_exit }}
          FTZ_EXIT: ${{ steps.materialize.outputs.ftz_exit }}
          FINALIZE_EXIT: ${{ steps.finalize.outputs.exit }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          logs = {}
          for path in sorted(Path('reports/guide_live_freeze_logs').glob('*.log')):
              data = path.read_bytes()
              logs[path.name] = {'byte_size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          payload = {
              'schema_version': 'guide_financial_live_freeze_attempt_v1',
              'scope_id': 'GUIDE_BOUNDED_100_PERCENT',
              'completed_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'head_sha': os.environ.get('GITHUB_SHA', ''),
              'exit_codes': {
                  'ocif': int(os.environ.get('OCIF_EXIT') or 999),
                  'ocs': int(os.environ.get('OCS_EXIT') or 999),
                  'ftz': int(os.environ.get('FTZ_EXIT') or 999),
                  'finalize': int(os.environ.get('FINALIZE_EXIT') or 999),
              },
              'logs': logs,
              'scope_limitation': 'GUIDE_BOUNDED_100_PERCENT != ALL_PUERTO_RICO_FINANCE',
          }
          Path('reports/guide_financial_live_freeze_attempt_v1.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Commit immutable live-freeze evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .federation/gui-capabilities.json reports/guide_financial_live_freeze_attempt_v1.json reports/guide_financial_live_freeze_v1.json reports/guide_bounded_100_percent_certification_v1.json reports/guide_financial_avenue_source_audit_v1.csv reports/guide_financial_avenue_matrix_v1.csv reports/guide_financial_avenue_set_metrics_v1.json reports/guide_live_freeze_logs || true
          git add -f data/raw/guide_financial_avenue_snapshots data/staging/processed/pr_ocif_guide_financial_classes.csv data/staging/processed/pr_ocs_insurers.csv data/staging/processed/pr_ocs_insurer_annual_reports.csv data/staging/processed/pr_ftz_zones_sites.csv || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: freeze live guide financial source manifestations"
          git push origin HEAD:audit/guide-financial-avenue-coverage-v1
