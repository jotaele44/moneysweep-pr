# Rendered from thehub-pr/federation-templates/baseline/dependabot.yml.
# Edit the template there and re-render (tools/render_federation_templates.py);
# do not hand-edit this file — template-drift.yml fails the build if you do.
#
# Three ecosystems, because a dependency reaches this repo three ways: Python
# packages, the dashboard/frontend npm tree, and the actions CI runs. Minor and
# patch bumps are grouped so the weekly PR volume stays reviewable; majors still
# arrive as individual PRs since they need a human read.
#
# The files thehub-pr renders into this repo are excluded below: its workflows
# from the actions ecosystem, and its pip manifests (requirements-desktop.txt in
# the desktop producers) from the pip ecosystem. A version bumped in a rendered
# copy diverges from its template and fails template-drift.yml, so those
# versions move only in the template: thehub-pr's own Dependabot bumps it there,
# and the change reaches this repo in a template sync PR. thehub-pr renders its
# own variant of this file, baseline/dependabot.hub.yml, for that.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Filled in by the renderer from targets.yaml: the rendered files this
    # ecosystem would read as manifests. Where it renders none, the renderer
    # leaves this key out, and every manifest here keeps its bumps.
    exclude-paths: ["requirements-desktop.txt"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Filled in by the renderer from targets.yaml: exactly the workflows it
    # renders into this repo. template-drift.yml is not one of them (only its
    # PRII_TEMPLATE_REF is managed), so its actions keep their Dependabot bumps.
    exclude-paths: [".github/workflows/codeql.yml", ".github/workflows/docs-sync.yml", ".github/workflows/gui-capability-parity.yml", ".github/workflows/secret-scan.yml"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
