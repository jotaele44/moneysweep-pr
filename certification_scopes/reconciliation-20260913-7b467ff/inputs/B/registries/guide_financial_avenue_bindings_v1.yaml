certification_exclusions:
  - >-
    scripts/download_act60.py contains a seed fallback when live sources fail.
    Rows whose provenance is known_seed_data are NONCANONICAL and cannot satisfy
    an avenue denominator or current-beneficiary certification.
  - >-
    CANDIDATE_NOT_IDENTITY routes count as representation for set accounting but
    never as identity or denominator proof.
