  boundedness_note: >-
    The guide states that it does not cover the subject exhaustively. This
    denominator certifies only financial avenues explicitly mentioned by this
    frozen guide manifestation; it must never be promoted to an exhaustive
    denominator for all Puerto Rico finance.

inclusion_rule: >-
  Include an explicitly named financing channel, regulated financial/investment
  vehicle, or tax-incentive/economic-development avenue that can direct capital,
  credit, investment, or a tax benefit to a person, entity, project, or sector.
  Preserve raw guide terminology separately from the canonical lane label.

exclusion_rule: >-
  Exclude ordinary compliance taxes, filing deadlines, entity-form mechanics,
  payroll/benefit obligations, and descriptive macroeconomic statistics unless
  the guide presents them as a financing, investment, or incentive avenue.

certification_rule: >-
  GUIDE_BOUNDED_100_PERCENT may PASS only when every canonical avenue below has
  a frozen authoritative public-source binding, a materialized source
  manifestation, explicit inclusion/exclusion semantics, schema and row-count
  closure, duplicate/null/identity/temporal/provenance gates passed, and zero
  unresolved residue inside the avenue claim. Registry presence or scraper code
  alone is insufficient.

