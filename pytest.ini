[pytest]
norecursedirs = archive
# --cov-fail-under is the coverage floor: a ratchet, not a target. Raise it
# (never lower) as more critical-path tests land.
#
# Scope widened 2026-09 (docs/GAP_ANALYSIS_AND_OPTIMIZATION_2026-09.md, finding
# B1/B2): server/, shared/, readiness/ and desktop/ were previously outside the
# measurement even though tests exercise them -- 7 test files import
# server.backend.*, so the whole FastAPI surface was being tested but not
# counted. Widening the denominator by 1,153 statements RAISED the total from
# 54.57% to 54.75%, because the newly-counted code is 64% covered, above the
# repo average. The floor therefore stays at 44%; no re-baselining was needed.
#
# run_all_legacy.py (2,073 LOC at the repo root) is still outside the
# measurement -- see finding B4.
addopts = --cov=scripts --cov=moneysweep --cov=server --cov=shared --cov=readiness --cov=desktop --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=44
markers =
    unit: pure logic tests with minimal filesystem or process coupling
    integration: multi-module or filesystem-backed behavior tests
    pipeline_gate: production, pause, recovery, blocker, or phase-gate invariant tests
    non_executing: audits, docs, configuration, validation, and status checks that do not execute source recovery
    external: tests around external source boundaries or downloader modules; included in default pytest unless explicitly filtered
    slow: long-running tests reserved for explicit selection; no tests are marked slow by default in R4.9Z-F

