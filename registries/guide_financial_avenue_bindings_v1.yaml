version: "1.0"
schema_version: guide_financial_avenue_bindings_v1
scope_id: GUIDE_BOUNDED_100_PERCENT
# base_registry_snapshot was first frozen at 6ccd83fbb0ef7ad33d692cc36b27a94433500fcd
# (158 sources). It is extended here by exactly the 3 sources materialized to
# close GFAV-004/005/020 (ocif_guide_financial_classes, ocs_insurer_registry,
# ftz_board_pr) -> 161. This is a deliberate, in-place refresh of the frozen
# denominator, not a new dated snapshot; unrelated live-registry growth since
# 6ccd83f (e.g. hacienda_sut_ivu, census_gov_finances, ...) is NOT folded in
# here because none of it binds to a guide avenue.
base_registry_snapshot:
  ref: 6ccd83fbb0ef7ad33d692cc36b27a94433500fcd+guide_avenue_gap_closure
  expected_source_count: 161
  source_ids_sha256: bdec501cf01d4baf70b6aaf968f0b16a574996a3ff3fe00236d8ffaf546e278b
  source_ids_file: reports/guide_financial_avenue_source_audit_v1.csv

allowed_binding_states:
  - AUTHORITATIVE_ROUTE
  - SUPPORTING_ROUTE
  - CANDIDATE_NOT_IDENTITY
  - ABSENT

# This mapping is deliberately source-route coverage, not certification.
# A route can exist while the source is unmaterialized or semantically incomplete.
bindings:
  GFAV-001:
    state: AUTHORITATIVE_ROUTE
    source_ids: [fdic, fhlb]
    note: FDIC/FHLB cover regulated banking institutions and bank-system finance; not every OCIF class.
  GFAV-002:
    state: AUTHORITATIVE_ROUTE
    source_ids: [sec_edgar, sec_13f_nport]
    note: SEC filings and holdings cover U.S. capital-market issuers/positions; Puerto Rico has no separate stock exchange in the guide.
  GFAV-003:
    state: AUTHORITATIVE_ROUTE
    source_ids: [bde_loans]
    note: Dedicated Economic Development Bank loan lane; currently manual-export dependent.
  GFAV-004:
    state: AUTHORITATIVE_ROUTE
    source_ids: [ocif_guide_financial_classes]
    note: >-
      OCIF concessionaire registry, filtered to ENTIDAD FINANCIERA
      INTERNACIONAL and ENTIDAD BANCARIA INTERNACIONAL license classes;
      live-materialized 2026-09-12.
  GFAV-005:
    state: AUTHORITATIVE_ROUTE
    source_ids: [ocs_insurer_registry]
    note: >-
      Official OCS domestic-insurer current listing plus per-insurer annual
      financial-report index (2010-2025); live-materialized 2026-09-12.
  GFAV-006:
    state: CANDIDATE_NOT_IDENTITY
    source_ids: [sec_edgar]
    note: SEC may discover REIT issuers, but it is not a Puerto Rico REIT tax-election denominator.
  GFAV-007:
    state: CANDIDATE_NOT_IDENTITY
    source_ids: [sec_edgar, sec_13f_nport]
    note: SEC filings can discover investment companies/funds, but do not by themselves prove Puerto Rico registration under the guide's local regime.
  GFAV-008:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives]
  GFAV-009:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives]
  GFAV-010:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives]
  GFAV-011:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives]
    note: Incentive route only; insurer/reinsurer regulatory denominator is separate.
  GFAV-012:
    state: AUTHORITATIVE_ROUTE
    source_ids: [p3_authority, act_transition_ppp]
    note: Dedicated P3 authority route plus materialized ACT transition concession evidence.
  GFAV-013:
    state: SUPPORTING_ROUTE
    source_ids: [ddec_incentives]
    note: Incentive route exists, but the private-equity fund regulatory denominator is absent from the frozen base registry.
  GFAV-014:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives, tourism_room_tax]
  GFAV-015:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives]
  GFAV-016:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives, eia_power_sector]
  GFAV-017:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives, usda_farm_subsidies]
  GFAV-018:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives]
  GFAV-019:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives]
  GFAV-020:
    state: AUTHORITATIVE_ROUTE
    source_ids: [ftz_board_pr]
    note: >-
      U.S. FTZ Board OFIS zone/site records for Puerto Rico Zones 7, 61 and
      163, the frozen discovery denominator; live-materialized 2026-09-12.
  GFAV-021:
