# GFAV-004/005/020 were promoted out of this block into `bindings:` above once
# ocif_guide_financial_classes / ocs_insurer_registry / ftz_board_pr
# materialized. GFAV-007/011/013 remain proposed-only: the OCIF scraper does
# not currently retain the "INVESTMENT COMPANIES" license class (only
# INVESTMENT ADVISOR), so it does not yet prove those avenues' denominators.
proposed_overlay_bindings:
  GFAV-007: [ocif_guide_financial_classes]
  GFAV-011: [ocs_insurer_registry, pr_act_60_decrees, ddec_incentives]
  GFAV-013: [ocif_guide_financial_classes, ddec_incentives]

certification_exclusions:
  - >-
    scripts/download_act60.py contains a seed fallback when live sources fail.
    Rows whose provenance is known_seed_data are NONCANONICAL and cannot satisfy
    an avenue denominator or current-beneficiary certification.
  - >-
    CANDIDATE_NOT_IDENTITY routes count as representation for set accounting but
    never as identity or denominator proof.
