  GFAV-023:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives, bde_loans, sba_loans]
  GFAV-024:
    state: SUPPORTING_ROUTE
    source_ids: [pr_act_60_decrees, ddec_incentives]
  GFAV-025:
